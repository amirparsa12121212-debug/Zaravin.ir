
<!-- بخش استعلام قیمت زاراوین -->
<section id="price" class="section">
  <div class="container">
    <div class="section-heading">
      <span class="eyebrow">PRICE INQUIRY</span>
      <h2>استعلام قیمت <span class="accent">زاراوین</span></h2>
      <p>نوع محصول و ابعاد موردنظر خود را وارد کنید.</p>
    </div>

    <div class="price-box">
      <form id="priceForm">
        <div class="field">
          <label for="product">نوع محصول</label>
          <select id="product" required>
            <option value="">انتخاب کنید</option>
            <option value="پنجره UPVC">پنجره UPVC</option>
            <option value="درب UPVC">درب UPVC</option>
            <option value="پنجره آلومینیومی">پنجره آلومینیومی</option>
            <option value="درب و پنجره سفارشی">درب و پنجره سفارشی</option>
          </select>
        </div>

        <div class="dimensions">
          <div class="field">
            <label for="width">عرض (سانتی‌متر)</label>
            <input
              id="width"
              type="number"
              min="1"
              max="2000"
              placeholder="مثلاً 120"
              required
            >
          </div>

          <div class="field">
            <label for="height">طول / ارتفاع (سانتی‌متر)</label>
            <input
              id="height"
              type="number"
              min="1"
              max="2000"
              placeholder="مثلاً 150"
              required
            >
          </div>
        </div>

        <div class="field">
          <label for="quantity">تعداد</label>
          <input
            id="quantity"
            type="number"
            min="1"
            max="1000"
            value="1"
            required
          >
        </div>

        <div class="field">
          <label for="details">توضیحات (اختیاری)</label>
          <textarea
            id="details"
            rows="3"
            placeholder="رنگ، نوع شیشه یا توضیحات دیگر..."
          ></textarea>
        </div>

        <div class="price-summary">
          <span>مساحت تقریبی هر محصول</span>
          <strong id="area">۰ متر مربع</strong>
        </div>

        <button class="btn btn-orange price-submit" type="submit">
          ارسال درخواست استعلام قیمت
        </button>

        <p class="price-note">
          قیمت نهایی پس از بررسی مشخصات توسط زاراوین اعلام می‌شود.
        </p>
      </form>
    </div>
  </div>
</section>

<style>
  .price-box {
    max-width: 650px;
    margin: 0 auto;
    padding: 30px;
    background: #fff;
    border: 1px solid #e4ecea;
    border-radius: 20px;
    box-shadow: 0 12px 35px rgba(20, 57, 58, .07);
  }

  .price-box form {
    display: grid;
    gap: 18px;
  }

  .price-box .field {
    display: grid;
    gap: 7px;
  }

  .price-box label {
    font-size: 13px;
    font-weight: bold;
  }

  .price-box input,
  .price-box select,
  .price-box textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #dce7e5;
    border-radius: 10px;
    background: #fbfdfc;
    color: #172d30;
    font: inherit;
    font-size: 13px;
    outline: none;
  }

  .price-box input:focus,
  .price-box select:focus,
  .price-box textarea:focus {
    border-color: #087e83;
    box-shadow: 0 0 0 3px rgba(8, 126, 131, .08);
  }

  .dimensions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }

  .price-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 15px;
    background: #e6f4f2;
    border-radius: 10px;
    font-size: 12px;
  }

  .price-summary strong {
    color: #087e83;
    font-size: 14px;
  }

  .price-submit {
    width: 100%;
    border: none;
  }

  .price-note {
    text-align: center;
    font-size: 11px;
    color: #78898a;
  }

  @media (max-width: 480px) {
    .price-box {
      padding: 20px 15px;
    }

    .dimensions {
      grid-template-columns: 1fr;
    }
  }
</style>

<script>
  const priceForm = document.getElementById("priceForm");
  const widthInput = document.getElementById("width");
  const heightInput = document.getElementById("height");
  const quantityInput = document.getElementById("quantity");
  const areaOutput = document.getElementById("area");

  function updateArea() {
    const width = Number(widthInput.value);
    const height = Number(heightInput.value);

    if (width > 0 && height > 0) {
      const area = (width * height) / 10000;
      areaOutput.textContent =
        area.toLocaleString("fa-IR", {
          maximumFractionDigits: 3
        }) + " متر مربع";
    } else {
      areaOutput.textContent = "۰ متر مربع";
    }
  }

  widthInput.addEventListener("input", updateArea);
  heightInput.addEventListener("input", updateArea);

  priceForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const product = document.getElementById("product").value;
    const width = Number(widthInput.value);
    const height = Number(heightInput.value);
    const quantity = Number(quantityInput.value);
    const details = document.getElementById("details").value.trim();

    if (
      !product ||
      !Number.isFinite(width) ||
      !Number.isFinite(height) ||
      !Number.isFinite(quantity) ||
      width < 1 || width > 2000 ||
      height < 1 || height > 2000 ||
      quantity < 1 || quantity > 1000
    ) {
      alert("لطفاً اطلاعات و ابعاد را به‌درستی وارد کنید.");
      return;
    }

    const area = (width * height) / 10000;

    const message =
      "سلام، درخواست استعلام قیمت از سایت زاراوین دارم.\n\n" +
      "نوع محصول: " + product + "\n" +
      "عرض: " + width + " سانتی‌متر\n" +
      "طول / ارتفاع: " + height + " سانتی‌متر\n" +
      "مساحت هر محصول: " + area.toFixed(3) + " متر مربع\n" +
      "تعداد: " + quantity + "\n" +
      "مجموع مساحت تقریبی: " +
      (area * quantity).toFixed(3) + " متر مربع\n" +
      "توضیحات: " + (details || "ندارد");

    const whatsappURL =
      "https://wa.me/989177638433?text=" +
      encodeURIComponent(message);

    window.open(whatsappURL, "_blank");
  });
</script>
